# 站点配置 —— 适用 GitHub Pages 默认 Jekyll
title: 我的博客
description: 用 GitHub Pages + Jekyll 搭的个人博客，Markdown 写作，支持 Mermaid 流程图，记录 nanobot 学习笔记
# baseurl 留空（username.github.io 仓库就是根路径）
baseurl: ""
url: ""

# 你的 GitHub 用户名（改这里，会显示在页脚）
github_username: yorkhellen

# 主题与插件（都是 GitHub Pages 官方支持列表内的）
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
